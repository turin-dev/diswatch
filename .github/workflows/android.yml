name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, lint, debug and optimized release
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        if: always()
        with:
          name: diswatch-build-and-reports
          path: |
            app/build/outputs/apk/
            app/build/reports/
          retention-days: 7
